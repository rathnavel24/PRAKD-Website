# prakd.in — Prakd company site (static) + enquiry API. Source: ~/apps/prakd-site
# Go back to the maintenance page with: sudo bash ~/apps/prakd-site/deploy/install.sh maintenance

# Real visitor IP: tunnel traffic arrives from localhost with Cloudflare's CF-Connecting-IP;
# anything else (LAN) uses the peer address so the header can't be spoofed.
map $remote_addr $prakd_client_ip {
    127.0.0.1 $http_cf_connecting_ip;
    ::1       $http_cf_connecting_ip;
    default   $remote_addr;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include snippets/latency.conf;

    root /var/www/prakd;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enquiry backend (~/apps/prakd-site/backend, systemd: prakd-backend)
    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Client-IP       $prakd_client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Short cache so edits show up quickly
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
