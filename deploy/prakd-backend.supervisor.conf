; Prakd enquiry backend (FastAPI) under Supervisor. Installed to /etc/supervisor/conf.d/prakd-backend.conf
;   sudo supervisorctl status
;   sudo supervisorctl restart prakd-backend
;   sudo supervisorctl tail -f prakd-backend
[program:prakd-backend]
command=/home/rat/apps/prakd-site/backend/run.sh
directory=/home/rat/apps/prakd-site/backend
user=rat
environment=HOME="/home/rat"
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/prakd-backend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
